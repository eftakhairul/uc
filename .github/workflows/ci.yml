name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test

  windows:
    name: Windows tests
    # Native Windows job: unit tests (including the exec_windows.go
    # spawn-and-wait fallback) plus the Windows e2e suite, which drives the
    # compiled uc.exe through Git Bash (preinstalled on windows runners).
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: E2E tests
        # shell: bash puts Git Bash's /usr/bin at the front of PATH for the
        # whole test process tree, so uc's LookPath("bash") finds Git Bash
        # rather than the WSL stub at C:\Windows\System32\bash.exe.
        shell: bash
        run: go test -tags e2e ./e2e/...

  e2e:
    name: E2E tests
    # Only on PRs (against the compiled binary, in a Docker container via
    # testcontainers-go) — slower and needs Docker, so it's kept off the
    # per-commit push path that the unit-test job covers.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run e2e tests
        run: make test-e2e

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
