name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Staged pipeline: each stage gates the next, so a failure stops the run
# instead of burning every runner in parallel.
#
#   test  ──▶  windows ─┐
#              e2e      ├──▶  build (downloadable archives)
#              vulncheck┘
#
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          out="$(find . -path ./vendor -prune -o -name '*.go' -print | xargs gofmt -l)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test

  windows:
    name: Windows e2e tests
    # Native Windows job: unit tests (including the exec_windows.go
    # spawn-and-wait fallback) plus the Windows e2e suite, which drives the
    # compiled uc.exe through Git Bash (preinstalled on windows runners).
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: E2E tests
        # shell: bash puts Git Bash's /usr/bin at the front of PATH for the
        # whole test process tree, so uc's LookPath("bash") finds Git Bash
        # rather than the WSL stub at C:\Windows\System32\bash.exe.
        shell: bash
        run: go test -tags e2e ./e2e/...

  e2e:
    name: E2E tests
    # Only on PRs (against the compiled binary, in a Docker container via
    # testcontainers-go) — slower and needs Docker, so it's kept off the
    # per-commit push path that the unit-test job covers.
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run e2e tests
        run: make test-e2e

  govulncheck:
    name: govulncheck
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  build:
    name: Build binaries
    # Final stage: cross-compiles every target in .goreleaser.yml and uploads
    # the archives to this run's page, so any commit is downloadable without
    # waiting for a tagged release. Same GoReleaser config and composite
    # action the release workflow uses — only the args differ (snapshot here,
    # publish there), so the target list never has to be kept in sync.
    needs: [test, windows, e2e, govulncheck]
    # e2e is skipped on pushes, and a skipped dependency would otherwise skip
    # this job too; this runs whenever nothing upstream actually failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so GoReleaser can derive the snapshot version
          # from git describe rather than reporting a shallow-clone error.
          fetch-depth: 0

      - name: Build all targets
        uses: ./.github/actions/goreleaser
        with:
          args: release --snapshot --clean --skip=publish

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: uc-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 30
