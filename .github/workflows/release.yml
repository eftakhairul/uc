name: release

# Run from Actions → release → "Run workflow", then pick the tag to release
# from the "Use workflow from" dropdown (switch to its "Tags" tab). GitHub
# does not support dynamically populated `choice` inputs, so the built-in ref
# picker is the only dropdown that always lists every existing tag.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level so the shared composite action's steps inherit them; the CI
    # build job needs none of these, since it never publishes.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
    steps:
      - name: Ensure a tag was selected
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Select a tag (not a branch) in the 'Use workflow from' dropdown. Got ${{ github.ref_type }} '${{ github.ref_name }}'."
          exit 1

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "Releasing tag: $TAG"
          git describe --tags --exact-match "$TAG"

      # Same composite action (and therefore the same .goreleaser.yml build
      # matrix) that CI's build job runs — only the args differ.
      - name: Publish release
        uses: ./.github/actions/goreleaser
        with:
          args: release --clean
