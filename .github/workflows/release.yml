name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (must already exist, e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level so the shared composite action's steps inherit them; the CI
    # build job needs none of these, since it never publishes.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GORELEASER_CURRENT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Verify tag matches go.mod version (optional sanity check)
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "Releasing tag: $TAG"
          git describe --tags --exact-match "$TAG"

      # Same composite action (and therefore the same .goreleaser.yml build
      # matrix) that CI's build job runs — only the args differ.
      - name: Publish release
        uses: ./.github/actions/goreleaser
        with:
          args: release --clean
